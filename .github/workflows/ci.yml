name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # Vangt handmatig bewerkte of ontbrekende migraties af voordat ze
      # op productie landen.
      - name: Migraties consistent
        run: npx drizzle-kit check

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

  ics:
    # De ICS-feed is het makkelijkst te slopen en het lastigst te merken,
    # want een agenda-app klaagt niet, hij toont gewoon niets meer.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Feed valideert
        run: npm run test -- lib/calendar.test.ts
