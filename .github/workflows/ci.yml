name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Next importeert de DB-client tijdens page collection. Er wordt tijdens de
    # build niet gequeryd, maar de driver verlangt wel een geldige URL.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ultimate_challenges_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # Vangt handmatig bewerkte of ontbrekende migraties af voordat ze
      # op productie landen.
      - name: Migraties consistent
        run: npx drizzle-kit check

      - name: Build
        run: npm run build

      # De ICS-feed is het makkelijkst te slopen en het lastigst te merken,
      # want een agenda-app klaagt niet, hij toont gewoon niets meer.
      - name: Tests
        run: npm test
